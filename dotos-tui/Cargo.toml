[package]
name = "dotos-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal frontend for Dotos (Rust + ratatui)"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
