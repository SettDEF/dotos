[package]
name = "icalcore"
version = "0.1.0"
edition = "2021"
description = "iCalendar parsing, vdir storage and RRULE expansion, shared by Kalends and Dotos"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
