<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Dotos: three dots, three states (done, doing, next) and their lines -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#302b38"/>
      <stop offset="1" stop-color="#1c1a21"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <!-- done -->
  <circle cx="38" cy="40" r="11" fill="#7fd1a0"/>
  <path d="M32.5 40.5 L36.5 44.5 L44 36.5" fill="none" stroke="#1c1a21" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="58" y="36" width="34" height="8" rx="4" fill="#e6e1e8" fill-opacity="0.3"/>
  <!-- doing -->
  <circle cx="38" cy="64" r="13" fill="#c4a6f2" fill-opacity="0.25"/>
  <circle cx="38" cy="64" r="8" fill="#c4a6f2"/>
  <rect x="58" y="60" width="46" height="8" rx="4" fill="#e6e1e8" fill-opacity="0.9"/>
  <!-- next -->
  <circle cx="38" cy="88" r="9" fill="none" stroke="#e6e1e8" stroke-opacity="0.75" stroke-width="4"/>
  <rect x="58" y="84" width="28" height="8" rx="4" fill="#e6e1e8" fill-opacity="0.6"/>
</svg>
