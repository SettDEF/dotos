[package]
name = "dotos"
version = "0.1.0"
edition = "2021"
description = "Tasks for the ii desktop — CLI and JSON backend for the QML app"

[dependencies]
base64 = "0.22"
# LAN sync (lan.rs): peers prove they hold the team key
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
icalcore = { path = "../../icalcore" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", features = ["json"] }
